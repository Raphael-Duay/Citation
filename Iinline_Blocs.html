<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline & Block</title>

	<style>
		body{
			font-family: sans-serif;
			font-size: 20px;
			line-height: 150%;
			margin: 5rem;
		}
		div{
			border: 2px solid lightcoral
		}
		div{
			border: 2px solid lightcoral;
			padding: 1rem;
		}
		span{
			border-bottom: 2px solid lightblue;
		}
		
	</style>

</head>
<body>

	<div>
		Lorem ipsum dolor sit, amet consectetur adipisicing elit.
		<span>
			Nihil molestias voluptatibus aspernatur,
			quia fugit maiores numquam illum asperiores amet,
			consequatur assumenda error eius.
		</span>
		Iure aliquam alias vitae sit numquam labore.
	</div>
	
</body>
</html>
